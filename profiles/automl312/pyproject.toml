[project]
name = "field-automl312"
version = "0.1.0"
description = "독립 Python 3.12 PyCaret 4 환경"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pycaret[notebook]==4.0.0a8",
    "catboost==1.2.10",
    "xgboost==3.4.1",
    "lightgbm==4.7.0",
    "optuna==5.0.0",
    "optuna-integration==5.0.0",
    "tabulate==0.10.0",
    "ipykernel==7.3.0",
    "nbconvert==7.17.1",
]

[tool.uv]
package = false
# 반입 wheel은 Windows x64 전용으로 받는다.
environments = ["sys_platform == 'win32' and platform_machine == 'AMD64'"]
