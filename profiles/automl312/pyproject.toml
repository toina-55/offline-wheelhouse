[project]
name = "field-automl312"
version = "0.1.0"
description = "독립 Python 3.12 PyCaret 4 환경"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pycaret[notebook]==4.0.0a8",
    "catboost==1.2.10",
    "xgboost==3.4.1",
    "lightgbm==4.7.0",
    "optuna==5.0.0",
    "optuna-integration==5.0.0",
    "tabulate==0.10.0",
    "ipykernel==7.3.0",
    "nbconvert==7.17.1",
]

[tool.uv]
package = false
# 반입 wheel은 Windows x64 전용으로 받는다.
# 🔴 implementation_name 을 반드시 함께 고정한다. 빼면 uv 의 universal 해석이
#    PyPy 분기까지 만족시키려 하고, pyzmq 의 `cffi; implementation_name == "pypy"`
#    때문에 오프라인 해석이 실패한다(pip 은 CPython 호스트에서 그 마커가 false 라
#    cffi 를 받지 않는다). sys_platform 문제가 아니라 Windows 에서도 똑같이 난다.
environments = [
    "sys_platform == 'win32' and platform_machine == 'AMD64' and implementation_name == 'cpython'",
]
